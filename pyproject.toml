[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-memory-agent"
version = "1.0.0"
description = "Agentic, time-aware organizational memory over meeting transcripts"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
    "langgraph>=0.2",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "numpy>=1.26",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
local = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
meeting-agent = "meeting_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires an ingested corpus",
    "slow: long-running end-to-end test",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
