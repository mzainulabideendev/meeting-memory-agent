<svg width="1100" height="740" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window chrome -->
  <rect width="1100" height="740" fill="#0f172a"/>
  <rect x="0" y="0" width="1100" height="42" fill="#1e293b"/>
  <circle cx="16" cy="21" r="7" fill="#ef4444"/>
  <circle cx="33" cy="21" r="7" fill="#f59e0b"/>
  <circle cx="50" cy="21" r="7" fill="#22c55e"/>
  <text x="90" y="28" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">meeting-memory-agent — agents working (svg screenshot)</text>
  <text x="980" y="28" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" text-anchor="end">heuristic provider · $0.00 · offline</text>

  <!-- header -->
  <text x="30" y="82" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Working agents</text>
  <text x="30" y="106" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">LangGraph StateGraph · deterministic · 6 agents · citations verified verbatim</text>

  <!-- left: agent cards -->
  <rect x="30" y="130" width="340" height="575" fill="#1e293b" rx="10" stroke="#334155" stroke-width="1"/>
  <text x="52" y="160" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Agents (src/meeting_agent/agents/)</text>
  <text x="52" y="179" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">Every agent runs offline with the heuristic provider; LLM providers are plug-in replacements.</text>

  <g transform="translate(52, 200)">
    <rect x="0" y="0" width="296" height="76" fill="url(#cardGrad)" rx="8" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="10" height="10" rx="2" fill="#38bdf8"/>
    <text x="32" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">RetrievalAgent</text>
    <text x="32" y="43" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">retrieval_agent.py — vector (Chroma, MiniLM-L6) + keyword (FTS5 BM25), RRF fusion k=60</text>
    <rect x="240" y="40" width="42" height="14" rx="4" fill="#1e40af"/>
    <text x="261" y="50" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">deterministic</text>
  </g>

  <g transform="translate(52, 288)">
    <rect x="0" y="0" width="296" height="76" fill="url(#cardGrad)" rx="8" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="10" height="10" rx="2" fill="#818cf8"/>
    <text x="32" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">ReasoningAgent</text>
    <text x="32" y="43" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">reasoning_agent.py — temporal reasoning: proposed → confirmed → superseded chains</text>
    <rect x="240" y="40" width="42" height="14" rx="4" fill="#1e40af"/>
    <text x="261" y="50" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">deterministic</text>
  </g>

  <g transform="translate(52, 376)">
    <rect x="0" y="0" width="296" height="76" fill="url(#cardGrad)" rx="8" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="10" height="10" rx="2" fill="#22d3ee"/>
    <text x="32" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">AnswerAgent</text>
    <text x="32" y="43" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">answer_agent.py — citation-first answer, LLM or extractive fallback, 1–3 verbatim quotes</text>
    <rect x="240" y="40" width="42" height="14" rx="4" fill="#1e40af"/>
    <text x="261" y="50" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">deterministic</text>
  </g>

  <g transform="translate(52, 464)">
    <rect x="0" y="0" width="296" height="76" fill="url(#cardGrad)" rx="8" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="10" height="10" rx="2" fill="#a78bfa"/>
    <text x="32" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">BriefingAgent</text>
    <text x="32" y="43" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">briefing_agent.py — four-section pre-meeting brief, each bullet with a verified quote</text>
    <rect x="240" y="40" width="42" height="14" rx="4" fill="#1e40af"/>
    <text x="261" y="50" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">deterministic</text>
  </g>

  <g transform="translate(52, 552)">
    <rect x="0" y="0" width="296" height="76" fill="url(#cardGrad)" rx="8" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="10" height="10" rx="2" fill="#34d399"/>
    <text x="32" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">CitationAgent</text>
    <text x="32" y="43" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">citation_agent.py — verbatim validator: meeting exists, ≥6 words, inside one turn, never edited</text>
    <rect x="240" y="40" width="42" height="14" rx="4" fill="#1e40af"/>
    <text x="261" y="50" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">deterministic</text>
  </g>

  <g transform="translate(52, 640)">
    <rect x="0" y="0" width="296" height="60" fill="url(#cardGrad)" rx="8" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="10" height="10" rx="2" fill="#fb923c"/>
    <text x="32" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Researcher</text>
    <text x="32" y="43" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">researcher.py — bounded research loop: broaden query + targeted scan (max 2 rounds)</text>
  </g>

  <!-- right: agent graph flow -->
  <rect x="395" y="130" width="675" height="575" fill="#1e293b" rx="10" stroke="#334155" stroke-width="1"/>
  <text x="417" y="160" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700">LangGraph answer workflow (per question)</text>
  <text x="417" y="179" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">read top to bottom · diamonds are decisions · loop bounded at 2 research rounds</text>

  <g transform="translate(425, 212)">
    <!-- Question -->
    <rect x="0" y="0" width="230" height="34" rx="6" fill="#334155"/>
    <text x="115" y="22" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Question (Q01–Q25)</text>
  </g>
  <path d="M217,52 Q260,52 260,86" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(260, 72)">
    <rect x="0" y="0" width="230" height="34" rx="6" fill="url(#nodeGrad)"/>
    <text x="115" y="22" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Analyze · intent, entities, team filter</text>
  </g>
  <path d="M217,106 Q260,106 260,140" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(260, 126)">
    <rect x="0" y="0" width="230" height="34" rx="6" fill="url(#nodeGrad)"/>
    <text x="115" y="22" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Plan queries · 1 original + N expansions</text>
  </g>
  <path d="M375,143 Q430,143 430,176" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M375,143 Q430,143 430,212" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- semantic -->
  <g transform="translate(430, 162)">
    <rect x="0" y="0" width="230" height="34" rx="6" fill="url(#nodeGrad)"/>
    <text x="115" y="22" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Vector search · Chroma, top-k</text>
  </g>
  <path d="M430,196 Q480,196 480,230" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- keyword -->
  <g transform="translate(430, 202)">
    <rect x="0" y="0" width="230" height="34" rx="6" fill="url(#nodeGrad)"/>
    <text x="115" y="22" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Keyword search · FTS5 BM25, top-k</text>
  </g>
  <path d="M660,219 Q720,219 720,252" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- collect -->
  <g transform="translate(720, 238)">
    <rect x="0" y="0" width="230" height="34" rx="6" fill="url(#nodeGrad)"/>
    <text x="115" y="22" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Collect and fuse · RRF k=60</text>
  </g>
  <path d="M720,272 Q770,272 770,306" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- sufficiency gate -->
  <g transform="translate(770, 292)">
    <rect x="0" y="0" width="230" height="34" rx="6" fill="#4c1d95"/>
    <text x="115" y="22" fill="#e0e7ff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Evidence sufficient? (≥ 0.7 gate)</text>
  </g>
  <!-- loop back -->
  <path d="M1000,309 Q1050,309 1050,262" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1050,262 Q900,262 900,252" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="895" y="247" fill="#fb923c" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600">no · max 2 rounds</text>
  <!-- yes down -->
  <path d="M885,326 Q935,326 935,360" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- temporal -->
  <g transform="translate(935, 346)">
    <rect x="0" y="0" width="230" height="34" rx="6" fill="url(#nodeGrad)"/>
    <text x="115" y="22" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Temporal reasoning · confirmed vs superseded</text>
  </g>
  <path d="M1165,380 Q1215,380 1215,414" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- answer -->
  <g transform="translate(1215, 400)">
    <rect x="0" y="0" width="230" height="34" rx="6" fill="url(#nodeGrad)"/>
    <text x="115" y="22" fill="#bfdbfe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Generate answer · LLM or extractive</text>
  </g>
  <path d="M1445,417 Q1495,417 1495,451" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- citation check -->
  <g transform="translate(1495, 437)">
    <rect x="0" y="0" width="230" height="34" rx="6" fill="#4c1d95"/>
    <text x="115" y="22" fill="#e0e7ff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Citations verbatim? (CitationAgent)</text>
  </g>
  <!-- regenerate loop -->
  <path d="M1725,454 Q1775,454 1775,407" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1775,407 Q1670,407 1670,397" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1665" y="392" fill="#fb923c" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600">no · regenerate</text>
  <!-- yes out -->
  <path d="M1725,488 Q1775,488 1775,522" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output -->
  <g transform="translate(1775, 508)">
    <rect x="0" y="0" width="230" height="34" rx="6" fill="#166534"/>
    <text x="115" y="22" fill="#dcfce7" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Output · answers.json + brief.md</text>
  </g>

  <!-- bottom metrics strip -->
  <rect x="395" y="720" width="0" height="0" fill="none"/>
  <g transform="translate(30, 720)">
    <rect x="0" y="0" width="1040" height="0" fill="none"/>
  </g>
  <!-- metrics badges -->
  <rect x="30" y="716" width="190" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="44" y="734" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700">100%</text>
  <text x="82" y="734" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">citation validity</text>
  <rect x="236" y="716" width="190" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="250" y="734" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700">60/60</text>
  <text x="288" y="734" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">tests passed</text>
  <rect x="442" y="716" width="190" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="456" y="734" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700">4 / 4 / 3</text>
  <text x="512" y="734" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">correct / partial / incorrect</text>
  <rect x="648" y="716" width="190" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="662" y="734" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700">138</text>
  <text x="696" y="734" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">meetings · 35 teams</text>
  <rect x="854" y="716" width="216" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="868" y="734" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Built by</text>
  <text x="942" y="734" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700">mzainulabideendev</text>
</svg>
